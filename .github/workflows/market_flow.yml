name: market-flow
on:
  schedule:
    - cron: "30 7 * * 1-5"   # 平日 16:30 JST(東証の引け後)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy plotly
      - name: stock pages
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python market_flow.py --no-holdings --nav --notify -o docs/index.html
          python market_flow.py --market us --no-holdings --nav -o docs/us.html
      - name: fx page (失敗しても他のページの更新は続ける)
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python fx_flow.py --nav --notify -o docs/fx.html
      - name: publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Update market flow report"
          git pull --rebase origin main || true
          git push
